name: Documentation Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          mkdir -p out/governance
          printf '%s\n' "$GITHUB_SHA" > out/governance/source-commit.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate documentation governance
        run: python3 scripts/check_docs.py 2>&1 | tee out/governance/governance.log
      - name: Retain governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-${{ github.sha }}-${{ github.run_attempt }}
          path: out/governance/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
