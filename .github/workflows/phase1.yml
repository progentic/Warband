name: Phase 1 Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1-linux:
    name: Phase 1 Linux Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-19
      CXX: /usr/bin/clang++-19
      CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install compatible LLVM dependencies
        run: bash scripts/install_linux_toolchain.sh
      - name: Build and verify pinned Odin
        run: bash scripts/build_odin.sh linux_amd64
      - name: Build Warband and verify ELF x86-64
        run: bash scripts/build_warband.sh linux_amd64
      - name: Verify governance and negative controls
        run: |
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests/governance -v
      - name: Verify every declared Odin test
        run: python3 scripts/run_odin_tests.py --odin .local/toolchains/odin-linux_amd64/odin --output out/linux_amd64/tests
      - name: Verify CLI behavior
        run: python3 scripts/verify_cli.py out/linux_amd64/warband
      - name: Summarize evidence
        run: |
          cat out/linux_amd64/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
          cat out/linux_amd64/package-installed.txt >> "$GITHUB_STEP_SUMMARY"

  phase1-macos:
    name: Phase 1 macOS Portability
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build pinned compiler and Warband
        run: |
          brew install llvm@19
          LLVM_CONFIG="$(brew --prefix llvm@19)/bin/llvm-config"
          CXX="$(brew --prefix llvm@19)/bin/clang++"
          export LLVM_CONFIG CXX
          bash scripts/build_odin.sh darwin_arm64
          bash scripts/build_warband.sh darwin_arm64
      - name: Verify governance and test inventory
        run: |
          LLVM_CONFIG="$(brew --prefix llvm@19)/bin/llvm-config"
          export LLVM_CONFIG
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests/governance -v
          python3 scripts/run_odin_tests.py --odin .local/toolchains/odin-darwin_arm64/odin --output out/darwin_arm64/tests
          python3 scripts/verify_cli.py out/darwin_arm64/warband
